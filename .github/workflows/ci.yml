name: egressa-ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.4"
  STRICT_PACKAGES: "./pkg/... ./internal/buildinfo/..."
  STRICT_THRESHOLD: "90"
  TUNNEL_PACKAGES: "./internal/tunnel/..."
  TUNNEL_THRESHOLD: "75"

jobs:
  quality:
    name: Code quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run strict-package tests with coverage
        run: |
          go test -race -count=1 \
            -coverprofile=coverage-strict.out -covermode=atomic \
            ${{ env.STRICT_PACKAGES }}

      - name: Enforce strict coverage threshold
        run: |
          go tool cover -func=coverage-strict.out | tail -1
          COVERAGE=$(go tool cover -func=coverage-strict.out | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "Coverage on ${{ env.STRICT_PACKAGES }}: ${COVERAGE}%"
          awk -v cov="$COVERAGE" -v th="${{ env.STRICT_THRESHOLD }}" \
            'BEGIN { if (cov + 0 < th + 0) { print "::error::coverage " cov "% is below the " th "% threshold"; exit 1 } }'

      - name: Run tunnel package tests with coverage (unprivileged)
        run: |
          go test -race -count=1 \
            -coverprofile=coverage-tunnel.out -covermode=atomic \
            ${{ env.TUNNEL_PACKAGES }}

      - name: Enforce tunnel coverage threshold
        run: |
          go tool cover -func=coverage-tunnel.out | tail -1
          COVERAGE=$(go tool cover -func=coverage-tunnel.out | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "Coverage on ${{ env.TUNNEL_PACKAGES }} (unprivileged): ${COVERAGE}%"
          awk -v cov="$COVERAGE" -v th="${{ env.TUNNEL_THRESHOLD }}" \
            'BEGIN { if (cov + 0 < th + 0) { print "::error::coverage " cov "% is below the " th "% threshold"; exit 1 } }'

      - name: Build tunnel test binary for the privileged run
        run: go test -race -c -o tunnel.test ./internal/tunnel/

      - name: Grant CAP_NET_ADMIN to the tunnel test binary
        run: sudo setcap cap_net_admin+ep ./tunnel.test

      - name: Run privileged tunnel tests (real TUN device, TestNewReal*)
        run: ./tunnel.test -test.v -test.run TestNewReal

      - name: Run privileged NAT tests (iptables)
        run: sudo go test -race -count=1 -run 'TestEnableIPForwarding|TestNAT_|TestHasNAT_' -v ./internal/tunnel/...

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage-strict.out
            coverage-tunnel.out
          if-no-files-found: error

  build:
    name: Build binaries
    needs:
      - quality
      - tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all cmd/ binaries
        run: make build

      - name: Cross-compile sanity check
        run: |
          GOOS=linux   GOARCH=amd64 go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: egressa-binaries
          path: bin/
          if-no-files-found: error
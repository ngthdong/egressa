name: egressa-ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.4"
  STRICT_PACKAGES: "./pkg/... ./internal/buildinfo/... ./internal/measurement/... ./internal/control/... ./internal/handoff/... ./internal/reorder/... ./internal/ipsec/... ./internal/telemetry/..."
  STRICT_THRESHOLD: "90"
  TUNNEL_PACKAGES: "./internal/tunnel/..."
  TUNNEL_THRESHOLD: "75"

jobs:
  quality:
    name: Code quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting (gofmt)
        # vendor/ holds third-party code exactly as published; some of it is
        # not gofmt-formatted, and it must never be edited, so skip it.
        run: |
          unformatted=$(gofmt -l $(find . -path ./vendor -prune -o -name '*.go' -print))
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run strict-package tests with coverage
        run: |
          go test -race -count=1 \
            -coverprofile=coverage-strict.out -covermode=atomic \
            ${{ env.STRICT_PACKAGES }}

      - name: Enforce strict coverage threshold
        run: |
          go tool cover -func=coverage-strict.out | tail -1
          COVERAGE=$(go tool cover -func=coverage-strict.out | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "Coverage on ${{ env.STRICT_PACKAGES }}: ${COVERAGE}%"
          awk -v cov="$COVERAGE" -v th="${{ env.STRICT_THRESHOLD }}" \
            'BEGIN { if (cov + 0 < th + 0) { print "::error::coverage " cov "% is below the " th "% threshold"; exit 1 } }'

      - name: Run tunnel package tests with coverage (unprivileged)
        run: |
          go test -race -count=1 \
            -coverprofile=coverage-tunnel.out -covermode=atomic \
            ${{ env.TUNNEL_PACKAGES }}

      - name: Enforce tunnel coverage threshold
        run: |
          go tool cover -func=coverage-tunnel.out | tail -1
          COVERAGE=$(go tool cover -func=coverage-tunnel.out | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "Coverage on ${{ env.TUNNEL_PACKAGES }} (unprivileged): ${COVERAGE}%"
          awk -v cov="$COVERAGE" -v th="${{ env.TUNNEL_THRESHOLD }}" \
            'BEGIN { if (cov + 0 < th + 0) { print "::error::coverage " cov "% is below the " th "% threshold"; exit 1 } }'

      - name: Build tunnel test binary for the privileged run
        run: go test -race -c -o tunnel.test ./internal/tunnel/

      - name: Grant CAP_NET_ADMIN to the tunnel test binary
        run: sudo setcap cap_net_admin+ep ./tunnel.test

      - name: Run privileged tunnel tests (real TUN device, TestNewReal*)
        run: ./tunnel.test -test.v -test.run 'TestNewReal|TestAccessGateway_DelegatesToRealDevice'

      - name: Run privileged NAT and end-to-end tests (iptables)
        run: sudo $(which go) test -race -count=1 -run 'TestEnableIPForwarding|TestNAT_|TestHasNAT_|TestGateway_RealInternetRoundTrip|TestEgressGateway_ConfigureNAT|TestAccessForwardsToBackbone' -v ./internal/tunnel/...

      - name: Install strongSwan (charon and the vici plugin)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            strongswan-charon strongswan-swanctl libstrongswan-standard-plugins
          # The tests start their own charons, one per network namespace;
          # a system charon is not needed.
          sudo systemctl stop strongswan strongswan-starter 2>/dev/null || true

      - name: Remove the AppArmor profile confining charon
        # The profile keeps charon from reading a test strongswan.conf or
        # creating a vici socket in a temp dir.
        run: |
          if [ -f /etc/apparmor.d/usr.lib.ipsec.charon ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.lib.ipsec.charon || true
          fi

      - name: Run privileged IPsec tests (real charon, TestIPsec_*)
        # Dependencies are vendored, so the root build needs no module
        # download. Here a skipped or missing test is a failure: the
        # previous steps exist so that nothing is skipped.
        run: |
          set -o pipefail
          sudo env "PATH=$PATH" go test -race -count=1 -v -run TestIPsec_ ./internal/ipsec/ | tee ipsec-e2e.log
          if grep -q -- '--- SKIP' ipsec-e2e.log; then
            echo "::error::IPsec end-to-end tests were skipped:"
            grep -- 'skipping' ipsec-e2e.log
            exit 1
          fi
          passed=$(grep -c -- '--- PASS: TestIPsec_' ipsec-e2e.log || true)
          if [ "$passed" -lt 2 ]; then
            echo "::error::expected TestIPsec_Backend and TestIPsec_Vici to pass, $passed did"
            exit 1
          fi

      - name: Load the kernel modules the end-to-end test needs
        # netem shapes the links between the test's namespaces; on some
        # runner kernels it ships in linux-modules-extra.
        run: |
          if ! sudo modprobe sch_netem 2>/dev/null; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          fi
          sudo modprobe veth
          sudo modprobe bridge

      - name: Run the end-to-end test (real binaries, migrations under netem)
        # Controller, two gateways, a client and an Internet server, each
        # in its own network namespace. A skip is a failure here.
        run: |
          set -o pipefail
          sudo env "PATH=$PATH" go test -count=1 -v -run TestManagedMigration ./internal/e2e/ | tee e2e.log
          if grep -q -- '--- SKIP' e2e.log; then
            echo "::error::the end-to-end test was skipped:"
            grep -- 'skipping' e2e.log
            exit 1
          fi
          grep -q -- '--- PASS: TestManagedMigration' e2e.log

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage-strict.out
            coverage-tunnel.out
            ipsec-e2e.log
            e2e.log
          if-no-files-found: error

  build:
    name: Build binaries
    needs:
      - quality
      - tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all cmd/ binaries
        run: make build

      - name: Cross-compile sanity check
        run: |
          GOOS=linux   GOARCH=amd64 go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: egressa-binaries
          path: bin/
          if-no-files-found: error
# The VPS testbed: one public IP per line. Copy to inventory.ini (which git
# ignores, since it holds real addresses) and fill it in.
#
# gateways need gateway_id= (lowercase letters, digits, dashes); the
# netem scenarios in deploy/scenarios call them gw1, gw2. A client may set
# name= (default "client") and exit= (the egress it connects to; default
# the first gateway).

[controller]
192.0.2.10

[gateways]
192.0.2.11 gateway_id=gw1
192.0.2.12 gateway_id=gw2
...

[clients]
192.0.2.20 name=client

[all:vars]
ansible_user=root
# The one host allowed to scrape the metrics ports: where Prometheus
# (deploy/observability) runs.
prometheus_source=198.51.100.5

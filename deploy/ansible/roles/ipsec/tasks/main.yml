---
# strongSwan's charon, which egressa drives over vici for IPsec between a
# client and its entry gateway. egressa installs its own XFRM interfaces
# and routes, so charon must not add any.

- name: Install strongSwan (charon with systemd and vici)
  ansible.builtin.apt:
    name: [charon-systemd, strongswan-swanctl]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Keep charon's hands off routes and addresses
  ansible.builtin.copy:
    dest: /etc/strongswan.d/egressa.conf
    content: |
      # Managed by Ansible (deploy/ansible/roles/ipsec).
      charon-systemd {
        install_routes = no
        install_virtual_ip = no
      }
    owner: root
    group: root
    mode: "0644"
  notify: Restart strongswan

- name: Run strongSwan
  ansible.builtin.systemd_service:
    name: strongswan
    state: started
    enabled: true

- name: Apply a changed strongSwan setting now
  ansible.builtin.meta: flush_handlers

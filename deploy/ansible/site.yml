---
# Brings the VPS testbed up: make testbed-up (after make cross).
- name: Preflight
  hosts: all
  become: true
  gather_facts: true
  roles: [egressa, preflight]

- name: TLS for the controller's API
  hosts: controller
  gather_facts: false
  roles: [egressa, tls]

- name: Base and firewall
  hosts: all
  become: true
  roles: [egressa, common, firewall]

- name: Controller
  hosts: controller
  become: true
  roles: [egressa, controller]

# One at a time: a gateway that restarts drops the sessions it carries,
# and the role waits for it to be healthy, its backbones up, before the
# next one goes.
- name: Gateways
  hosts: gateways
  become: true
  serial: 1
  roles: [egressa, gateway]

- name: Clients
  hosts: clients
  become: true
  serial: 1
  roles: [egressa, client]

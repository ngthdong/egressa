# Scrapes every egressa process listed in targets/*.json: local.json is
# written by deploy/local/testbed.sh up, vps.json by
# `make observability-targets INVENTORY=...` from the Ansible inventory.
global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s

scrape_configs:
  - job_name: egressa
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 5s

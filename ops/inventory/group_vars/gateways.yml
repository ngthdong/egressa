---
sysctl_ip_forward: 1           # gateways forward VPN traffic
# The gateway installs its own NAT / FORWARD / policy-routing rules and removes them on exit.
# UFW's default "deny routed" would drop the forwarded VPN traffic, so let it through here;
# inbound traffic to the host itself is still default-deny.
ufw_default_routed: allow
vpn_ports:
  - { port: "{{ egressa_wg_port }}", proto: udp }
egressa_roles: "access,egress"

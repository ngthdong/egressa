---
# IPs are read from environment variables (GitHub Secrets in CI, `export` locally),
# so no real IP lives in the repo.
all:
  vars:
    ansible_user: "{{ lookup('env', 'ANSIBLE_REMOTE_USER') | default('deploy', true) }}"
    ansible_port: "{{ ssh_port }}"
  children:
    controller:
      hosts:
        vpn-controller:
          ansible_host: "{{ lookup('env', 'CONTROLLER_IP') }}"
    gateways:
      hosts:
        vpn-gw1:   # deployed first = canary
          ansible_host: "{{ lookup('env', 'GATEWAY1_IP') }}"
          egressa_id: hk    # gateway --id; CHANGE to your real region name (clients use it in --egress)
        vpn-gw2:
          ansible_host: "{{ lookup('env', 'GATEWAY2_IP') }}"
          egressa_id: sg

---
- name: "{{ lv.mount }}: create logical volume"
  community.general.lvol:
    vg: "{{ storage_vg }}"
    lv: "{{ lv.name }}"
    size: "{{ lv.size }}"

- name: "{{ lv.mount }}: create filesystem"
  community.general.filesystem:
    fstype: ext4
    dev: "/dev/{{ storage_vg }}/{{ lv.name }}"

- name: "{{ lv.mount }}: already a mount point?"
  ansible.builtin.command: "mountpoint -q {{ lv.mount }}"
  register: mp
  changed_when: false
  failed_when: false

- name: "{{ lv.mount }}: migrate existing data and mount"
  when: mp.rc != 0
  block:
    - name: Stop services that write here
      ansible.builtin.command: "service {{ item }} stop"
      loop: "{{ lv.stop_services | default([]) }}"
      changed_when: true
      failed_when: false

    - name: Temporary mount
      ansible.builtin.shell: |
        set -e
        mkdir -p /mnt/migrate-{{ lv.name }}
        mount /dev/{{ storage_vg }}/{{ lv.name }} /mnt/migrate-{{ lv.name }}
      changed_when: true

    - name: Copy existing data (keeps ACLs/xattrs, stays on one filesystem)
      ansible.builtin.command: "rsync -aHAXx {{ lv.mount }}/ /mnt/migrate-{{ lv.name }}/"
      changed_when: true

    - name: Remove temporary mount
      ansible.builtin.shell: |
        set -e
        umount /mnt/migrate-{{ lv.name }}
        rmdir /mnt/migrate-{{ lv.name }}
      changed_when: true

    - name: Add fstab entry and mount
      ansible.posix.mount:
        path: "{{ lv.mount }}"
        src: "/dev/{{ storage_vg }}/{{ lv.name }}"
        fstype: ext4
        opts: "{{ lv.opts }}{{ ',nofail' if storage_nofail | bool else '' }}"
        passno: 2
        state: mounted

    - name: Restore permissions of the mount point
      ansible.builtin.file:
        path: "{{ lv.mount }}"
        mode: "{{ lv.mode | default('0755') }}"

  always:
    - name: Start services again
      ansible.builtin.command: "service {{ item }} start"
      loop: "{{ lv.stop_services | default([]) }}"
      changed_when: true
      failed_when: false

- name: "{{ lv.mount }}: make sure mount options are applied"
  ansible.posix.mount:
    path: "{{ lv.mount }}"
    src: "/dev/{{ storage_vg }}/{{ lv.name }}"
    fstype: ext4
    opts: "{{ lv.opts }}{{ ',nofail' if storage_nofail | bool else '' }}"
    passno: 2
    state: mounted
  when: mp.rc == 0
